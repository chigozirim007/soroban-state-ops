<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="favCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#00A8FF" />
    </linearGradient>
    <linearGradient id="favWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>
  </defs>

  <!-- Dark Obsidian Shield Background -->
  <rect x="2" y="2" width="96" height="96" rx="22" fill="#04070D" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.3" />

  <!-- Corner Brackets -->
  <path d="M 12 22 L 12 12 L 22 12" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  <path d="M 88 22 L 88 12 L 78 12" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  <path d="M 12 78 L 12 88 L 22 88" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />
  <path d="M 88 78 L 88 88 L 78 88" stroke="#00F0FF" stroke-width="1.8" stroke-linecap="round" opacity="0.6" />

  <!-- Outer Circuit Track (The 'S' shape) -->
  <path
    d="M 52 16 
       L 32 16 
       C 23 16, 18 21, 18 30 
       L 18 40 
       C 18 47, 24 51, 32 53 
       L 68 53 
       C 76 55, 82 59, 82 66 
       L 82 72 
       C 82 81, 76 86, 66 86 
       L 38 86"
    stroke="url(#favCyan)"
    stroke-width="4.2"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Inner Circuit Track -->
  <path
    d="M 64 22 
       L 36 22 
       C 30 22, 26 26, 26 32 
       L 26 36 
       C 26 42, 30 45, 36 47 
       L 62 47 
       C 70 49, 74 53, 74 60 
       L 74 68 
       C 74 74, 70 78, 62 78 
       L 48 78"
    stroke="#00F0FF"
    stroke-width="2.6"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Upper Abacus Rod and Counter Beads -->
  <line x1="38" y1="32" x2="82" y2="32" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />
  <line x1="82" y1="32" x2="82" y2="44" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />
  <rect x="52" y="27" width="5.5" height="10" rx="2.5" fill="url(#favCyan)" />
  <rect x="59" y="27" width="5.5" height="10" rx="2.5" fill="url(#favCyan)" />
  <rect x="66" y="27" width="5.5" height="10" rx="2.5" fill="url(#favWhite)" />
  <rect x="73" y="27" width="5.5" height="10" rx="2.5" fill="url(#favWhite)" />

  <!-- Lower Abacus Rod and Counter Beads -->
  <line x1="18" y1="68" x2="62" y2="68" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />
  <line x1="18" y1="56" x2="18" y2="68" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />
  <rect x="23" y="63" width="5.5" height="10" rx="2.5" fill="url(#favWhite)" />
  <rect x="30" y="63" width="5.5" height="10" rx="2.5" fill="url(#favWhite)" />
  <rect x="37" y="63" width="5.5" height="10" rx="2.5" fill="url(#favCyan)" />
  <rect x="44" y="63" width="5.5" height="10" rx="2.5" fill="url(#favCyan)" />

  <!-- Circuit Terminal Solder Pads -->
  <circle cx="52" cy="16" r="3.2" fill="#00F0FF" />
  <circle cx="52" cy="16" r="1.4" fill="#04070D" />
  <circle cx="64" cy="22" r="2.8" fill="#FFFFFF" />
  <circle cx="64" cy="22" r="1.2" fill="#04070D" />
  <circle cx="82" cy="44" r="3.2" fill="#FFFFFF" />
  <circle cx="82" cy="44" r="1.4" fill="#04070D" />
  <circle cx="18" cy="56" r="3.2" fill="#FFFFFF" />
  <circle cx="18" cy="56" r="1.4" fill="#04070D" />
  <circle cx="48" cy="78" r="2.8" fill="#FFFFFF" />
  <circle cx="48" cy="78" r="1.2" fill="#04070D" />
  <circle cx="38" cy="86" r="3.2" fill="#00F0FF" />
  <circle cx="38" cy="86" r="1.4" fill="#04070D" />
  <circle cx="50" cy="50" r="2.2" fill="#00F0FF" />
</svg>
